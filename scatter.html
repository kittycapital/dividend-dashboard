<style>
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface2: #111111;
  --border: #1a1a1a;
  --border-hover: #2a2a2a;
  --text: #e4e4e7;
  --text-dim: #71717a;
  --text-muted: #52525b;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --cyan: #22d3ee;
  --blue: #4a90ff;
  --gold: #ffd644;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', -apple-system, sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ====== HEADER ====== */
.header {
  padding: 36px 20px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.header .sub { font-size: 13px; color: var(--text-dim); }
.header .time { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; }

/* ====== SHARE ====== */
.share-bar { display: flex; gap: 6px; justify-content: center; margin: 16px 0 4px; flex-wrap: wrap; }
.share-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-hover); background: var(--surface); color: #a1a1aa; font-size: 11px; cursor: pointer; font-family: var(--sans); transition: all 0.2s; }
.share-btn:hover { border-color: #444; color: var(--text); }
.share-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.share-btn.twitter:hover { border-color: #1d9bf0; color: #1d9bf0; }
.share-btn.kakao:hover { border-color: #fee500; color: #fee500; }
.share-btn.telegram:hover { border-color: #26a5e4; color: #26a5e4; }
.share-btn.instagram:hover { border-color: #e1306c; color: #e1306c; }
.share-btn.instagram.copied { border-color: var(--green); color: var(--green); }
.share-btn.copy:hover { border-color: var(--green); color: var(--green); }
.share-btn.copied { border-color: var(--green); color: var(--green); }

/* ====== TOAST ====== */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #000; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ====== LEGEND ====== */
.legend {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 24px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  justify-content: center;
}

.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ====== BUBBLE NOTE ====== */
.bubble-note {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 12px;
  font: 11px var(--mono);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
}

.bubble-note-dot { display: flex; align-items: center; gap: 5px; }
.bn-small { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--text-muted); }
.bn-large { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text-muted); }

/* ====== CHART ====== */
.chart-area { max-width: 1200px; margin: 0 auto; padding: 0 24px 20px; }

.chart-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  position: relative;
}

.chart-box::after {
  content: 'Herdvibe.com';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font: 700 28px var(--mono);
  color: rgba(255,255,255,0.04);
  pointer-events: none;
  z-index: 2;
  white-space: nowrap;
}

canvas { width: 100% !important; cursor: crosshair; }

/* ====== QUADRANT OVERLAYS ====== */
.quad-overlay {
  position: absolute;
  pointer-events: none;
  z-index: 5;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  max-width: 140px;
}

.quad-overlay .qo-title { font: 700 11px var(--sans); margin-bottom: 2px; }
.quad-overlay .qo-desc { font: 10px var(--sans); color: var(--text-muted); line-height: 1.4; }

.qo-top-left { top: 32px; left: 32px; }
.qo-top-right { top: 32px; right: 32px; text-align: right; }
.qo-bottom-left { bottom: 68px; left: 32px; }
.qo-bottom-right { bottom: 68px; right: 32px; text-align: right; }

/* ====== TOOLTIP ====== */
.tooltip {
  position: absolute;
  display: none;
  background: rgba(10,10,10,0.95);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  pointer-events: none;
  z-index: 100;
  min-width: 200px;
  backdrop-filter: blur(10px);
  font-size: 13px;
}

.tooltip .tt-ticker { font: 700 16px var(--mono); color: var(--cyan); }
.tooltip .tt-name { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
.tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 4px; }
.tooltip .tt-label { color: var(--text-muted); font-size: 11px; }
.tooltip .tt-val { font: 600 13px var(--mono); }

/* ====== QUAD STATS ====== */
.quad-stats {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 20px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.quad-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: center;
}

.quad-label {
  font: 600 10px var(--mono);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.quad-value { font: 700 20px var(--mono); }
.quad-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ====== GOLDEN LIST ====== */
.golden-list { max-width: 1200px; margin: 0 auto; padding: 0 24px 40px; }

.golden-title {
  font: 700 15px var(--sans);
  color: var(--gold);
  margin-bottom: 12px;
  text-align: center;
}

.golden-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }

.golden-card {
  background: var(--surface);
  border: 1px solid rgba(255,214,68,0.12);
  border-radius: var(--radius);
  padding: 14px;
  transition: border-color 0.2s;
}

.golden-card:hover { border-color: rgba(255,214,68,0.35); }

.gc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.gc-ticker { font: 700 15px var(--mono); color: var(--cyan); }
.gc-sector { font-size: 10px; color: var(--text-muted); padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; }
.gc-metrics { display: flex; gap: 12px; }
.gc-metric-label { font: 10px var(--mono); color: var(--text-muted); }
.gc-metric-val { font: 600 14px var(--mono); }

/* ====== FOOTER ====== */
.footer {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 40px;
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
}

/* ====== MOBILE ====== */
@media (max-width: 768px) {
  .header { padding: 20px 16px 14px; }
  .header h1 { font-size: 22px; }
  .legend { padding: 12px 16px 10px; gap: 8px; }
  .bubble-note { padding: 0 16px 10px; font-size: 10px; flex-wrap: wrap; justify-content: center; }
  .chart-area { padding: 0 12px 16px; }
  .chart-box { padding: 12px; }
  .chart-box::after { font-size: 20px; }
  .quad-overlay { padding: 4px 7px; max-width: 110px; }
  .quad-overlay .qo-title { font-size: 10px; }
  .quad-overlay .qo-desc { font-size: 9px; }
  .qo-top-left { top: 16px; left: 16px; }
  .qo-top-right { top: 16px; right: 16px; }
  .qo-bottom-left { bottom: 50px; left: 16px; }
  .qo-bottom-right { bottom: 50px; right: 16px; }
  .quad-stats { grid-template-columns: repeat(2, 1fr); padding: 0 12px 16px; }
  .quad-value { font-size: 16px; }
  .golden-list { padding: 0 12px 30px; }
  .golden-grid { grid-template-columns: 1fr; }
  .share-bar { margin: 12px 0 4px; }
}
</style>
</head>

const SHARE_URL = 'https://herdvibe.com/53';
const SHARE_TITLE = '배당+주가 매트릭스 — Herdvibe';
const SHARE_DESC = 'S&P 500 배당수익률 vs 52주 주가수익률 버블차트 | Herdvibe';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function shareTwitter() {
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(SHARE_TITLE)}&url=${encodeURIComponent(SHARE_URL)}`, '_blank');
}
function shareKakao() {
  if (window.Kakao && !Kakao.isInitialized()) Kakao.init('a43ed7b39fac35458f4f9df925a279b5');
  if (window.Kakao) {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: { title: SHARE_TITLE, description: SHARE_DESC, imageUrl: 'https://herdvibe.com/og-dividend-matrix.png', link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL } }
    });
  }
}
function shareTelegram() {
  window.open(`https://t.me/share/url?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(SHARE_TITLE)}`, '_blank');
}
function fallbackCopy(text) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'copy', text: text }, '*');
  } else if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }
}

function shareInstagram(btn) {
  try {
    fallbackCopy(SHARE_URL);
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>복사됨!';
    showToast('링크가 복사되었습니다 - 인스타그램에 붙여넣기 하세요');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  } catch(e) { showToast('복사 실패'); }
}
function copyLink(btn) {
  try {
    fallbackCopy(SHARE_URL);
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>복사됨!';

  {ticker:"KO",name:"Coca-Cola",dividendYield:3.0,yearReturn:2.3,marketCap:260e9,sector:"Consumer Defensive",payoutRatio:71},

  {ticker:"SO",name:"Southern Co",dividendYield:3.8,yearReturn:5.4,marketCap:78.9e9,sector:"Utilities",payoutRatio:77},

  {ticker:"AMGN",name:"Amgen",dividendYield:3.2,yearReturn:6.7,marketCap:150e9,sector:"Healthcare",payoutRatio:58},
];

let allData = [];
let canvas, ctx, tooltip;
let chartBounds = {};
const PADDING = { top:30, right:30, bottom:60, left:70 };

function init(data) {
  allData = data;
  canvas = document.getElementById('scatterChart');
  ctx = canvas.getContext('2d');
  tooltip = document.getElementById('tooltip');

  buildLegend();
  buildQuadStats();
  buildGoldenList();
  drawChart();

  window.addEventListener('resize', drawChart);
  canvas.addEventListener('mousemove', handleHover);
  canvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');
  canvas.addEventListener('touchmove', e => { e.preventDefault(); handleTouch(e); }, {passive:false});
  canvas.addEventListener('touchend', () => tooltip.style.display = 'none');
}

function buildLegend() {
  const sectors = [...new Set(allData.map(s => s.sector))];
  document.getElementById('legendBar').innerHTML = sectors.map(s =>
    `<div class="legend-item"><div class="legend-dot" style="background:${SECTOR_COLORS[s]||'#888'}"></div>${SECTOR_KR[s]||s}</div>`
  ).join('');
}

function buildQuadStats() {
  const golden = allData.filter(s => s.dividendYield >= 3 && s.yearReturn >= 5);
  const trap = allData.filter(s => s.dividendYield >= 3 && s.yearReturn < 0);
  const growth = allData.filter(s => s.dividendYield < 3 && s.yearReturn >= 10);
  const avoid = allData.filter(s => s.dividendYield < 3 && s.yearReturn < 0);

  document.getElementById('quadStats').innerHTML = `
    <div class="quad-card">
      <div class="quad-label">황금 구간</div>
      <div class="quad-value" style="color:var(--gold)">${golden.length}개</div>
      <div class="quad-desc">고배당 + 주가상승</div></div>
    <div class="quad-card">
      <div class="quad-label">배당 함정?</div>
      <div class="quad-value" style="color:var(--red)">${trap.length}개</div>
      <div class="quad-desc">고배당 + 주가하락</div></div>
    <div class="quad-card">
      <div class="quad-label">성장주</div>
      <div class="quad-value" style="color:var(--cyan)">${growth.length}개</div>
      <div class="quad-desc">저배당 + 주가상승</div></div>
    <div class="quad-card">
      <div class="quad-label">위험 구간</div>
      <div class="quad-value" style="color:var(--text-muted)">${avoid.length}개</div>
      <div class="quad-desc">저배당 + 주가하락</div></div>`;
}

function buildGoldenList() {
  const golden = allData
    .filter(s => s.dividendYield >= 3 && s.yearReturn >= 5)
    .sort((a, b) => (b.dividendYield + b.yearReturn) - (a.dividendYield + a.yearReturn));

  document.getElementById('goldenGrid').innerHTML = golden.map(s => `
    <div class="golden-card">
      <div class="gc-top">
        <span class="gc-ticker">${s.ticker}</span>
        <span class="gc-sector">${SECTOR_KR[s.sector]||s.sector}</span>
      </div>
      <div class="gc-metrics">
        <div class="gc-metric">
          <div class="gc-metric-label">배당률</div>
          <div class="gc-metric-val" style="color:var(--green)">${s.dividendYield.toFixed(1)}%</div>
        </div>
        <div class="gc-metric">
          <div class="gc-metric-label">52주수익</div>
          <div class="gc-metric-val" style="color:var(--cyan)">+${s.yearReturn.toFixed(1)}%</div>
        </div>
        <div class="gc-metric">
          <div class="gc-metric-label">배당성향</div>
          <div class="gc-metric-val">${s.payoutRatio ? s.payoutRatio.toFixed(0)+'%' : '-'}</div>
        </div>
      </div>
    </div>`).join('');
}

function drawChart() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width - 48;
  const h = Math.min(500, Math.max(350, w * 0.55));

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  const plotW = w - PADDING.left - PADDING.right;
  const plotH = h - PADDING.top - PADDING.bottom;

  const yields = allData.map(s => s.dividendYield);
  const returns = allData.map(s => s.yearReturn);
  const mcaps = allData.map(s => s.marketCap);

  const xMin = 0, xMax = Math.ceil(Math.max(...yields) + 1);
  const yMin = Math.floor(Math.min(...returns) - 5);
  const yMax = Math.ceil(Math.max(...returns) + 5);
  const mcapMax = Math.max(...mcaps);

  chartBounds = { xMin, xMax, yMin, yMax, plotW, plotH, w, h };

  const xScale = v => PADDING.left + ((v - xMin) / (xMax - xMin)) * plotW;
  const yScale = v => PADDING.top + ((yMax - v) / (yMax - yMin)) * plotH;

  ctx.clearRect(0, 0, w, h);

  // Quadrant backgrounds
  const zeroY = yScale(0);
  const threeX = xScale(3);

  ctx.fillStyle = 'rgba(255,214,68,0.03)';
  ctx.fillRect(threeX, PADDING.top, PADDING.left + plotW - threeX, zeroY - PADDING.top);

  ctx.fillStyle = 'rgba(239,68,68,0.02)';
  ctx.fillRect(PADDING.left, zeroY, threeX - PADDING.left, PADDING.top + plotH - zeroY);

  // Grid
  ctx.strokeStyle = '#151515';
  ctx.lineWidth = 1;

  for (let x = 0; x <= xMax; x += 1) {
    const px = xScale(x);
    ctx.beginPath(); ctx.moveTo(px, PADDING.top); ctx.lineTo(px, PADDING.top + plotH); ctx.stroke();
  }
  const yStep = yMax - yMin > 60 ? 20 : yMax - yMin > 30 ? 10 : 5;
  for (let y = Math.ceil(yMin/yStep)*yStep; y <= yMax; y += yStep) {
    const py = yScale(y);
    ctx.beginPath(); ctx.moveTo(PADDING.left, py); ctx.lineTo(PADDING.left + plotW, py); ctx.stroke();
  }

  // Zero & 3% lines
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(PADDING.left, zeroY); ctx.lineTo(PADDING.left+plotW, zeroY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(threeX, PADDING.top); ctx.lineTo(threeX, PADDING.top+plotH); ctx.stroke();
  ctx.setLineDash([]);

  // Axis labels
  ctx.font = '10px JetBrains Mono';
  ctx.fillStyle = '#52525b';
  ctx.textAlign = 'center';
  for (let x = 0; x <= xMax; x += 1) {
    ctx.fillText(x + '%', xScale(x), PADDING.top + plotH + 20);
  }
  ctx.textAlign = 'right';
  for (let y = Math.ceil(yMin/yStep)*yStep; y <= yMax; y += yStep) {
    ctx.fillText((y>0?'+':'') + y + '%', PADDING.left - 10, yScale(y) + 4);
  }

  // Axis titles
  ctx.save();
  ctx.font = '12px Noto Sans KR';
  ctx.fillStyle = '#52525b';
  ctx.textAlign = 'center';
  ctx.fillText('배당수익률 →', PADDING.left + plotW/2, h - 8);
  ctx.translate(14, PADDING.top + plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('52주 주가수익률 →', 0, 0);
  ctx.restore();

  // Bubbles
  allData.forEach(s => {
    const x = xScale(s.dividendYield);
    const y = yScale(s.yearReturn);
    const r = Math.max(5, Math.min(25, Math.sqrt(s.marketCap / mcapMax) * 30));
    const color = SECTOR_COLORS[s.sector] || '#888';

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = color + '33';
    ctx.fill();
    ctx.strokeStyle = color + 'aa';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (r >= 7) {
      ctx.font = `${Math.max(8, Math.min(11, r*0.9))}px JetBrains Mono`;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(s.ticker, x, y + 3);
    }
  });

  allData._positions = allData.map(s => ({
    x: xScale(s.dividendYield),
    y: yScale(s.yearReturn),
    r: Math.max(5, Math.min(25, Math.sqrt(s.marketCap / mcapMax) * 30)),
  }));
}

function handleHover(e) {
  const rect = canvas.getBoundingClientRect();
  findPoint(e.clientX - rect.left, e.clientY - rect.top, e.clientX, e.clientY);
}

function handleTouch(e) {
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  findPoint(touch.clientX - rect.left, touch.clientY - rect.top, touch.clientX, touch.clientY);
}

function findPoint(mx, my, pageX, pageY) {
  if (!allData._positions) return;
  let found = null;
  allData._positions.forEach((p, i) => {
    if (Math.sqrt((mx-p.x)**2 + (my-p.y)**2) < p.r + 5) found = i;
  });

  if (found !== null) {
    const s = allData[found];
    const mc = s.marketCap >= 1e12 ? (s.marketCap/1e12).toFixed(1)+'T' :
               s.marketCap >= 1e9 ? (s.marketCap/1e9).toFixed(0)+'B' : (s.marketCap/1e6).toFixed(0)+'M';

    tooltip.innerHTML = `
      <div class="tt-ticker">${s.ticker}</div>
      <div class="tt-name">${s.name}</div>
      <div class="tt-row"><span class="tt-label">배당수익률</span><span class="tt-val" style="color:var(--green)">${s.dividendYield.toFixed(2)}%</span></div>
      <div class="tt-row"><span class="tt-label">52주 수익률</span><span class="tt-val" style="color:${s.yearReturn>=0?'var(--cyan)':'var(--red)'}">${s.yearReturn>=0?'+':''}${s.yearReturn.toFixed(1)}%</span></div>
      <div class="tt-row"><span class="tt-label">시가총액</span><span class="tt-val">$${mc}</span></div>
      <div class="tt-row"><span class="tt-label">배당성향</span><span class="tt-val">${s.payoutRatio?s.payoutRatio.toFixed(0)+'%':'-'}</span></div>
      <div class="tt-row"><span class="tt-label">섹터</span><span class="tt-val">${SECTOR_KR[s.sector]||s.sector}</span></div>`;
    tooltip.style.display = 'block';

    const chartRect = canvas.parentElement.getBoundingClientRect();
    let tx = pageX - chartRect.left + 15;
    let ty = pageY - chartRect.top - 30;
    if (tx + 220 > chartRect.width) tx -= 240;
    if (ty < 0) ty = 10;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  } else {
    tooltip.style.display = 'none';
  }
}

async function load() {
  try {
    const res = await fetch('scatter_data.json');
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('updateTime').textContent = `마지막 업데이트: ${data.updated}`;
    init(data.stocks);
  } catch(e) {
    document.getElementById('updateTime').textContent = '샘플 데이터 · scatter_data.json 없음';
    init(SAMPLE);
  }
}
load();
