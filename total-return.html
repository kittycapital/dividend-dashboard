<style>
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface2: #111111;
  --border: #1a1a1a;
  --border-hover: #2a2a2a;
  --text: #e4e4e7;
  --text-dim: #71717a;
  --text-muted: #52525b;
  --green: #22c55e;
  --red: #ef4444;
  --cyan: #22d3ee;
  --blue: #4a90ff;
  --gold: #ffd644;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', -apple-system, sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ====== HEADER ====== */
.header {
  padding: 36px 20px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.sub { font-size: 13px; color: var(--text-dim); }
.time { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; }

/* ====== SHARE ====== */
.share-bar { display: flex; gap: 6px; justify-content: center; margin: 16px 0 4px; flex-wrap: wrap; }
.share-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-hover); background: var(--surface); color: #a1a1aa; font-size: 11px; cursor: pointer; font-family: var(--sans); transition: all 0.2s; }
.share-btn:hover { border-color: #444; color: var(--text); }
.share-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.share-btn.twitter:hover { border-color: #1d9bf0; color: #1d9bf0; }
.share-btn.kakao:hover { border-color: #fee500; color: #fee500; }
.share-btn.telegram:hover { border-color: #26a5e4; color: #26a5e4; }
.share-btn.instagram:hover { border-color: #e1306c; color: #e1306c; }
.share-btn.instagram.copied { border-color: var(--green); color: var(--green); }
.share-btn.copy:hover { border-color: var(--green); color: var(--green); }
.share-btn.copied { border-color: var(--green); color: var(--green); }

.toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #000; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ====== TABS ====== */
.tabs {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
}

.tab {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hover);
  background: transparent;
  color: var(--text-dim);
  font: 500 13px var(--sans);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.tab:hover { border-color: var(--text-dim); color: var(--text); }
.tab.active { background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 600; }

/* ====== INSIGHT ====== */
.insight { max-width: 1400px; margin: 0 auto; padding: 0 24px 16px; }

.insight-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  gap: 24px;
  align-items: center;
  flex-wrap: wrap;
}

.insight-stat { text-align: center; min-width: 120px; }
.insight-label { font: 10px var(--mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.insight-val { font: 700 22px var(--mono); }
.insight-desc { flex: 1; font-size: 13px; color: var(--text-dim); min-width: 200px; line-height: 1.6; }

/* ====== BAR LEGEND ====== */
.bar-legend {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 12px;
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-dim);
}

.bl-item { display: flex; align-items: center; gap: 5px; }
.bl-swatch { width: 12px; height: 12px; border-radius: 3px; }

/* ====== TABLE ====== */
.table-wrap { max-width: 1400px; margin: 0 auto; padding: 0 24px 20px; overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }

thead th {
  padding: 12px 14px;
  text-align: left;
  font: 600 10px var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color 0.2s;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

thead th:hover { color: var(--cyan); }
thead th.sorted { color: var(--cyan); }

tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
tbody tr:hover { background: var(--surface2); }
tbody td { padding: 14px; white-space: nowrap; }

.rank { font: 700 14px var(--mono); color: var(--text-muted); text-align: center; width: 30px; }
.rank-top { color: var(--gold); }

.ticker-cell { display: flex; flex-direction: column; gap: 2px; }
.t-sym { font: 700 14px var(--mono); color: var(--cyan); }
.t-name { font-size: 11px; color: var(--text-muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }

.mono { font-family: var(--mono); }

/* Return bar */
.return-bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 180px; }
.return-bar-track { flex: 1; height: 20px; background: var(--surface2); border-radius: 4px; position: relative; overflow: hidden; min-width: 100px; }
.return-bar-price { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px 0 0 4px; transition: width 0.5s; }
.return-bar-div { position: absolute; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transition: left 0.5s, width 0.5s; }
.return-val { font: 700 13px var(--mono); min-width: 55px; text-align: right; }

.consec { font: 600 12px var(--mono); color: var(--gold); }

.sector-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border-hover);
  color: var(--text-dim);
}

/* ====== MOBILE CARDS ====== */
.card-list { display: none; }

.stock-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
}

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }

.card-rank { font: 11px var(--mono); color: var(--text-muted); background: var(--surface2); border-radius: 6px; padding: 2px 8px; margin-right: 8px; }
.card-rank-top { color: var(--gold); }

.card-ticker { font: 700 16px var(--mono); color: var(--cyan); }
.card-name { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.card-total { font: 700 20px var(--mono); text-align: right; }

.card-bar { height: 24px; background: var(--surface2); border-radius: 6px; position: relative; overflow: hidden; margin: 10px 0; }
.card-bar-price { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 6px 0 0 6px; }
.card-bar-div { position: absolute; top: 0; bottom: 0; border-radius: 0 6px 6px 0; }

.card-bar-labels { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--text-dim); }

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

/* ====== FOOTER ====== */
.footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 40px;
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
}

/* ====== MOBILE ====== */
@media (max-width: 768px) {
  .header { padding: 20px 16px 14px; }
  .header h1 { font-size: 22px; }

  .tabs {
    padding: 12px 16px;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; flex-shrink: 0; padding: 8px 16px; }

  .insight { padding: 0 16px 12px; }
  .insight-card { padding: 14px; gap: 14px; }
  .insight-val { font-size: 18px; }

  .table-wrap table { display: none !important; }
  .card-list { display: block; padding: 0 16px 20px; }
  .bar-legend { padding: 0 16px 10px; }
  .footer { padding: 0 16px 30px; }
  .share-bar { margin: 12px 0 4px; }
}
</style>
</head>

}

  try {

    "1y":{priceReturn:-28.3,divReturn:1.2,totalReturn:-27.1},"3y":{priceReturn:-55,divReturn:4,totalReturn:-51},"5y":{priceReturn:-60,divReturn:7,totalReturn:-53}}},
  {ticker:"LMT",name:"Lockheed Martin",dividendYield:2.7,sector:"Industrials",consecIncreases:20,totalReturns:{
    "1y":{priceReturn:13.4,divReturn:2.7,totalReturn:16.1},"3y":{priceReturn:35,divReturn:8,totalReturn:43},"5y":{priceReturn:55,divReturn:15,totalReturn:70}}},
  {ticker:"D",name:"Dominion Energy",dividendYield:5.6,sector:"Utilities",consecIncreases:0,totalReturns:{
    "1y":{priceReturn:-1.8,divReturn:5.6,totalReturn:3.8},"3y":{priceReturn:-20,divReturn:14,totalReturn:-6},"5y":{priceReturn:-30,divReturn:22,totalReturn:-8}}},
];

let allData = [], currentPeriod = '1y';

function setPeriod(p) {
  currentPeriod = p;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const stocks = allData
    .filter(s => s.totalReturns && s.totalReturns[currentPeriod])
    .sort((a, b) => b.totalReturns[currentPeriod].totalReturn - a.totalReturns[currentPeriod].totalReturn);

  if (!stocks.length) return;

  const avgTotal = stocks.reduce((s, x) => s + x.totalReturns[currentPeriod].totalReturn, 0) / stocks.length;
  const avgDiv = stocks.reduce((s, x) => s + x.totalReturns[currentPeriod].divReturn, 0) / stocks.length;
  const best = stocks[0];
  const periodLabel = currentPeriod === '1y' ? '1년' : currentPeriod === '3y' ? '3년' : '5년';

  document.getElementById('insightArea').innerHTML = `
    <div class="insight-card">
      <div class="insight-stat">
        <div class="insight-label">평균 총수익률 (${periodLabel})</div>
        <div class="insight-val" style="color:${avgTotal >= 0 ? 'var(--green)' : 'var(--red)'}">${avgTotal >= 0 ? '+' : ''}${avgTotal.toFixed(1)}%</div>
      </div>
      <div class="insight-stat">
        <div class="insight-label">배당이 추가한 수익</div>
        <div class="insight-val" style="color:var(--cyan)">+${avgDiv.toFixed(1)}%p</div>
      </div>
      <div class="insight-stat">
        <div class="insight-label">1위</div>
        <div class="insight-val" style="color:var(--gold)">${best.ticker}</div>
      </div>
      <div class="insight-desc">
        주가만 보면 놓치는 수익! ${periodLabel} 기준 배당이 평균 <strong style="color:var(--cyan)">${avgDiv.toFixed(1)}%p</strong> 추가 수익을 만들었습니다.
      </div>
    </div>`;

  const maxAbs = Math.max(...stocks.map(s => Math.abs(s.totalReturns[currentPeriod].totalReturn)), 1);

  document.getElementById('tbody').innerHTML = stocks.map((s, i) => {
    const r = s.totalReturns[currentPeriod];
    const totalColor = r.totalReturn >= 0 ? 'var(--green)' : 'var(--red)';
    const barMax = maxAbs;
    const priceW = Math.abs(r.priceReturn) / barMax * 50;
    const divW = Math.abs(r.divReturn) / barMax * 50;
    const priceColor = r.priceReturn >= 0 ? 'rgba(74,144,255,0.6)' : 'rgba(239,68,68,0.4)';

    return `<tr>
      <td class="rank ${i < 3 ? 'rank-top' : ''}">${i + 1}</td>
      <td><div class="ticker-cell"><span class="t-sym">${s.ticker}</span><span class="t-name">${s.name}</span></div></td>
      <td class="mono" style="color:${totalColor};font-weight:700;font-size:15px">${r.totalReturn >= 0 ? '+' : ''}${r.totalReturn.toFixed(1)}%</td>
      <td>
        <div class="return-bar-wrap">
          <div class="return-bar-track">
            <div class="return-bar-price" style="width:${priceW}%;background:${priceColor}"></div>
            <div class="return-bar-div" style="left:${priceW}%;width:${divW}%;background:rgba(34,197,94,0.5)"></div>
          </div>
          <span class="mono" style="font-size:11px;color:var(--text-dim)">${r.priceReturn >= 0 ? '+' : ''}${r.priceReturn.toFixed(0)} + ${r.divReturn.toFixed(0)}</span>
        </div>
      </td>
      <td class="mono" style="color:var(--green)">${s.dividendYield.toFixed(2)}%</td>
      <td class="consec">${s.consecIncreases > 0 ? s.consecIncreases + '년 연속' : '-'}</td>
      <td class="hide-mobile"><span class="sector-tag">${SECTOR_KR[s.sector] || s.sector}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('cardList').innerHTML = stocks.map((s, i) => {
    const r = s.totalReturns[currentPeriod];
    const totalColor = r.totalReturn >= 0 ? 'var(--green)' : 'var(--red)';
    const priceW = Math.max(1, Math.abs(r.priceReturn) / maxAbs * 50);
    const divW = Math.max(1, Math.abs(r.divReturn) / maxAbs * 50);
    const priceColor = r.priceReturn >= 0 ? 'rgba(74,144,255,0.6)' : 'rgba(239,68,68,0.4)';

    return `<div class="stock-card">
      <div class="card-top">
        <div style="display:flex;align-items:center">
          <span class="card-rank ${i < 3 ? 'card-rank-top' : ''}">${i + 1}</span>
          <div><div class="card-ticker">${s.ticker}</div><div class="card-name">${s.name}</div></div>
        </div>
        <div class="card-total" style="color:${totalColor}">${r.totalReturn >= 0 ? '+' : ''}${r.totalReturn.toFixed(1)}%</div>
      </div>
      <div class="card-bar">
        <div class="card-bar-price" style="width:${priceW}%;background:${priceColor}"></div>
        <div class="card-bar-div" style="left:${priceW}%;width:${divW}%;background:rgba(34,197,94,0.5)"></div>
      </div>
      <div class="card-bar-labels">
        <span>주가 ${r.priceReturn >= 0 ? '+' : ''}${r.priceReturn.toFixed(1)}%</span>
        <span style="color:var(--green)">배당 +${r.divReturn.toFixed(1)}%</span>
      </div>
      <div class="card-bottom">
        <span class="sector-tag">${SECTOR_KR[s.sector] || s.sector}</span>
        <span class="consec">${s.consecIncreases > 0 ? s.consecIncreases + '년 연속' : '-'}</span>
        <span class="mono" style="font-size:12px;color:var(--green)">${s.dividendYield.toFixed(1)}%</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('mainTable').style.display = 'table';
}

async function load() {
  try {
    const res = await fetch('total_return_data.json');
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('updateTime').textContent = `마지막 업데이트: ${data.updated}`;
    allData = data.stocks;
  } catch(e) {
    document.getElementById('updateTime').textContent = '샘플 데이터';
    allData = SAMPLE;
  }
  render();
}
load();
</script>
</body>
</html>
