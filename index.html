<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S&P 500 배당 수익률 TOP 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<style>
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface2: #111111;
  --border: #1a1a1a;
  --border-hover: #2a2a2a;
  --text: #e4e4e7;
  --text-dim: #71717a;
  --text-muted: #52525b;
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --cyan: #22d3ee;
  --accent-blue: #4a90ff;
  --accent-gold: #ffd644;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Noto Sans KR', -apple-system, sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: var(--mono); }

/* ====== HEADER ====== */
.header {
  padding: 36px 20px 24px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.header h1 {
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.header .subtitle { font-size: 13px; color: var(--text-dim); }
.header .update-time { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; }

/* ====== CONTROLS ====== */
.controls {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
}

.filter-btn {
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hover);
  background: transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-family: var(--sans);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
.filter-btn.active { background: var(--cyan); border-color: var(--cyan); color: #000; font-weight: 600; }

.search-box {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-hover);
  background: var(--surface);
  color: #fff;
  font-size: 13px;
  font-family: var(--mono);
  width: 180px;
  outline: none;
  transition: border-color 0.2s;
}

.search-box::placeholder { color: var(--text-muted); }
.search-box:focus { border-color: var(--cyan); }

/* ====== STATS BAR ====== */
.stats-bar {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}

.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  font-family: var(--mono);
}

.stat-value {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--cyan);
}

.stat-value.gold { color: var(--accent-gold); }
.stat-value.blue { color: var(--accent-blue); }

.stat-sub {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  font-family: var(--mono);
}

/* ====== TABLE ====== */
.table-wrapper {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px 24px;
  overflow-x: auto;
}

table { width: 100%; border-collapse: collapse; font-size: 13px; }

thead th {
  padding: 12px 14px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-family: var(--mono);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color 0.2s;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}

thead th:hover { color: var(--cyan); }
thead th.sorted { color: var(--cyan); }
thead th .sort-arrow { font-size: 9px; margin-left: 4px; }

tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

tbody tr:hover { background: var(--surface2); }
tbody td { padding: 14px; white-space: nowrap; }

.rank { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--text-muted); width: 30px; text-align: center; }
.rank-top { color: var(--accent-gold); }

.ticker-cell { display: flex; flex-direction: column; gap: 2px; }
.ticker-symbol { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--cyan); }
.ticker-name { font-size: 11px; color: var(--text-muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; }

.yield-cell { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.yield-high { color: var(--green); }
.yield-mid { color: var(--cyan); }
.yield-low { color: var(--accent-blue); }

.yield-bar-container { width: 60px; height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.yield-bar { height: 100%; border-radius: 2px; transition: width 0.5s ease; }

.payout-safe { color: var(--green); }
.payout-warn { color: var(--accent-gold); }
.payout-danger { color: var(--red); }

.sector-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border-hover);
  color: var(--text-dim);
}

.return-positive { color: var(--green); }
.return-negative { color: var(--red); }

.mcap-text { font-family: var(--mono); color: var(--text-dim); font-size: 12px; }

/* ====== LOADING ====== */
.loading { text-align: center; padding: 80px 20px; color: var(--text-muted); }
.loading .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--cyan); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg { text-align: center; padding: 60px 20px; color: var(--red); font-family: var(--mono); font-size: 13px; }

/* ====== SHARE ====== */
.share-bar { display: flex; gap: 6px; justify-content: center; margin: 12px 0 4px; flex-wrap: wrap; }
.share-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-hover); background: var(--surface); color: #a1a1aa; font-size: 11px; cursor: pointer; font-family: var(--sans); transition: all 0.2s; }
.share-btn:hover { border-color: #444; color: var(--text); }
.share-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.share-btn.twitter:hover { border-color: #1d9bf0; color: #1d9bf0; }
.share-btn.kakao:hover { border-color: #fee500; color: #fee500; }
.share-btn.telegram:hover { border-color: #26a5e4; color: #26a5e4; }
.share-btn.instagram:hover { border-color: #e1306c; color: #e1306c; }
.share-btn.instagram.copied { border-color: var(--green); color: var(--green); }
.share-btn.copy:hover { border-color: var(--green); color: var(--green); }
.share-btn.copied { border-color: var(--green); color: var(--green); }

/* ====== TOAST ====== */
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--green); color: #000; padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all 0.3s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }

/* ====== FOOTER ====== */
.footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 8px;
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
}

/* ====== MOBILE CARD VIEW ====== */
.card-list { display: none; }

.stock-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}

.stock-card:active { border-color: var(--cyan); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }

.card-rank { font-family: var(--mono); font-size: 11px; color: var(--text-muted); background: var(--surface2); border-radius: 6px; padding: 2px 8px; margin-right: 10px; }
.card-rank-top { color: var(--accent-gold); }

.card-ticker-group { flex: 1; }
.card-ticker { font-family: var(--mono); font-weight: 700; font-size: 16px; color: var(--cyan); }
.card-name { font-size: 12px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }

.card-yield { font-family: var(--mono); font-weight: 700; font-size: 22px; text-align: right; }

.card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.card-metric { background: var(--surface2); border-radius: var(--radius-sm); padding: 8px 10px; }
.card-metric-label { font-size: 10px; color: var(--text-muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.card-metric-value { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--text); }

.card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

.card-sector { font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border-hover); color: var(--text-dim); }
.card-mcap { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }

/* ====== TABLET ====== */
@media (max-width: 1024px) {
  .header { padding: 30px 20px 20px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .table-wrapper { padding: 0 12px 24px; }
  table { font-size: 12px; }
  tbody td { padding: 10px; }
  .hide-tablet { display: none; }
}

/* ====== MOBILE ====== */
@media (max-width: 768px) {
  .header { padding: 20px 16px 14px; }
  .header h1 { font-size: 22px; }
  .header .subtitle { font-size: 12px; }

  .controls {
    padding: 12px 16px;
    gap: 6px;
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .controls::-webkit-scrollbar { display: none; }

  .filter-btn { font-size: 12px; padding: 8px 14px; white-space: nowrap; flex-shrink: 0; }

  .search-box {
    width: 100%;
    flex-shrink: 0;
    order: -1;
    margin-left: 0;
    margin-bottom: 4px;
    padding: 10px 14px;
    font-size: 14px;
    border-radius: var(--radius-sm);
  }

  .stats-bar { grid-template-columns: repeat(2, 1fr); padding: 12px 16px; gap: 8px; }
  .stat-card { padding: 12px; }
  .stat-value { font-size: 18px; }
  .stat-label { font-size: 9px; }
  .stat-sub { font-size: 9px; }

  .table-wrapper table { display: none !important; }
  .card-list { display: block; padding: 0 16px 24px; }
  .footer { padding: 0 16px 8px; font-size: 10px; }
}

/* ====== SMALL MOBILE ====== */
@media (max-width: 380px) {
  .header h1 { font-size: 19px; }
  .stats-bar { gap: 6px; }
  .stat-value { font-size: 16px; }
  .card-grid { grid-template-columns: repeat(2, 1fr); }
  .card-yield { font-size: 18px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>S&P 500 배당 수익률 TOP 30</h1>
  <div class="subtitle">무료 API (yfinance) 기반 · 매일 자동 업데이트</div>
  <div class="update-time" id="updateTime">Loading...</div>
</div>

<div class="share-bar">
  <button class="share-btn twitter" onclick="shareTwitter()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>트위터</button>

</div>

<script>
/* ====== SHARE ====== */
const SHARE_URL = 'https://herdvibe.com/dividend-top30';
const SHARE_TITLE = 'S&P 500 배당 수익률 TOP 30 — Herdvibe';
const SHARE_DESC = 'S&P 500 고배당 종목 랭킹 및 배당 분석 | Herdvibe';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function shareTwitter() {
  window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(SHARE_TITLE)}&url=${encodeURIComponent(SHARE_URL)}`, '_blank');
}
function shareKakao() {
  if (window.Kakao && !Kakao.isInitialized()) Kakao.init('a43ed7b39fac35458f4f9df925a279b5');
  if (window.Kakao) {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: { title: SHARE_TITLE, description: SHARE_DESC, imageUrl: 'https://herdvibe.com/og-dividend.png', link: { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL } }
    });
  }
}
function shareTelegram() {
  window.open(`https://t.me/share/url?url=${encodeURIComponent(SHARE_URL)}&text=${encodeURIComponent(SHARE_TITLE)}`, '_blank');
}
function shareInstagram(btn) {
  try {
    if (window.parent !== window) { window.parent.postMessage({ type: 'copy', text: SHARE_URL }, '*'); }
    else { navigator.clipboard.writeText(SHARE_URL); }
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>복사됨!';
    showToast('링크가 복사되었습니다 - 인스타그램에 붙여넣기 하세요 ✓');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  } catch(e) { showToast('복사 실패'); }
}
function copyLink(btn) {
  try {
    if (window.parent !== window) { window.parent.postMessage({ type: 'copy', text: SHARE_URL }, '*'); }
    else { navigator.clipboard.writeText(SHARE_URL); }
    const orig = btn.innerHTML;
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>복사됨!';
    showToast('링크가 복사되었습니다 ✓');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  } catch(e) { showToast('복사 실패'); }
}

/* ====== DATA ====== */
let allStocks = [];
let currentFilter = 'all';
let currentSort = { key: 'dividendYield', dir: 'desc' };

const SECTOR_MAP = {
  'Energy':'에너지','Utilities':'유틸리티','Real Estate':'리츠',
  'Financial Services':'금융','Consumer Defensive':'필수소비',
  'Healthcare':'헬스케어','Technology':'기술','Industrials':'산업재',
  'Communication Services':'통신','Basic Materials':'소재',
};

const SECTOR_COLORS = {
  'Energy':'#ff6b35','Utilities':'#ffd644','Real Estate':'#22d3ee',
  'Financial Services':'#4a90ff','Consumer Defensive':'#22c55e',
  'Healthcare':'#ff66aa','Technology':'#a855f7','Industrials':'#ff9944',
  'Communication Services':'#66bbff','Basic Materials':'#88cc44',
};

function formatMarketCap(cap) {
  if (!cap) return '-';
  if (cap >= 1e12) return (cap / 1e12).toFixed(1) + 'T';
  if (cap >= 1e9) return (cap / 1e9).toFixed(0) + 'B';
  if (cap >= 1e6) return (cap / 1e6).toFixed(0) + 'M';
  return cap.toLocaleString();
}

function getYieldClass(y) { return y >= 5 ? 'yield-high' : y >= 3 ? 'yield-mid' : 'yield-low'; }
function getYieldColor(y) { return y >= 5 ? 'var(--green)' : y >= 3 ? 'var(--cyan)' : 'var(--accent-blue)'; }
function getPayoutClass(p) { if (p == null) return ''; return p <= 60 ? 'payout-safe' : p <= 80 ? 'payout-warn' : 'payout-danger'; }

function updateStats(stocks) {
  if (!stocks.length) return;
  const maxYield = stocks.reduce((a, b) => a.dividendYield > b.dividendYield ? a : b);
  document.getElementById('statMaxYield').textContent = maxYield.dividendYield.toFixed(2) + '%';
  document.getElementById('statMaxTicker').textContent = maxYield.ticker;
  const avgYield = stocks.reduce((s, x) => s + x.dividendYield, 0) / stocks.length;
  document.getElementById('statAvgYield').textContent = avgYield.toFixed(2) + '%';
  const payouts = stocks.filter(s => s.payoutRatio != null);
  const avgPayout = payouts.length ? payouts.reduce((s, x) => s + x.payoutRatio, 0) / payouts.length : 0;
  document.getElementById('statAvgPayout').textContent = avgPayout.toFixed(1) + '%';
  const returns = stocks.filter(s => s.yearReturn != null);
  const avgReturn = returns.length ? returns.reduce((s, x) => s + x.yearReturn, 0) / returns.length : 0;
  const retEl = document.getElementById('statAvgReturn');
  retEl.textContent = (avgReturn >= 0 ? '+' : '') + avgReturn.toFixed(1) + '%';
  retEl.style.color = avgReturn >= 0 ? 'var(--cyan)' : 'var(--red)';
}

function renderTable(stocks) {
  const maxYield = stocks.length ? Math.max(...stocks.map(s => s.dividendYield)) : 10;
  const tbody = document.getElementById('tableBody');

  tbody.innerHTML = stocks.map((s, i) => {
    const yieldPct = (s.dividendYield / maxYield * 100).toFixed(0);
    const sectorColor = SECTOR_COLORS[s.sector] || 'var(--text-dim)';
    const sectorKr = SECTOR_MAP[s.sector] || s.sector;
    return `<tr>
      <td class="rank ${i < 3 ? 'rank-top' : ''}">${i + 1}</td>
      <td><div class="ticker-cell"><span class="ticker-symbol">${s.ticker}</span><span class="ticker-name">${s.name}</span></div></td>
      <td><div class="yield-cell ${getYieldClass(s.dividendYield)}">${s.dividendYield.toFixed(2)}%</div><div class="yield-bar-container"><div class="yield-bar" style="width:${yieldPct}%;background:${getYieldColor(s.dividendYield)}"></div></div></td>
      <td class="mono">$${s.dividendRate.toFixed(2)}</td>
      <td class="mono">$${s.price.toFixed(2)}</td>
      <td class="mono ${getPayoutClass(s.payoutRatio)}">${s.payoutRatio != null ? s.payoutRatio.toFixed(1) + '%' : '-'}</td>
      <td class="mcap-text hide-mobile hide-tablet">${formatMarketCap(s.marketCap)}</td>
      <td class="mono ${s.yearReturn != null ? (s.yearReturn >= 0 ? 'return-positive' : 'return-negative') : ''}">${s.yearReturn != null ? (s.yearReturn >= 0 ? '+' : '') + s.yearReturn.toFixed(1) + '%' : '-'}</td>
      <td class="hide-mobile"><span class="sector-tag" style="border-color:${sectorColor};color:${sectorColor}">${sectorKr}</span></td>
    </tr>`;
  }).join('');

  const cardList = document.getElementById('cardList');
  cardList.innerHTML = stocks.map((s, i) => {
    const sectorColor = SECTOR_COLORS[s.sector] || 'var(--text-dim)';
    const sectorKr = SECTOR_MAP[s.sector] || s.sector;
    const returnClass = s.yearReturn != null ? (s.yearReturn >= 0 ? 'return-positive' : 'return-negative') : '';
    const returnText = s.yearReturn != null ? (s.yearReturn >= 0 ? '+' : '') + s.yearReturn.toFixed(1) + '%' : '-';
    return `<div class="stock-card">
      <div class="card-top">
        <div style="display:flex;align-items:center">
          <span class="card-rank ${i < 3 ? 'card-rank-top' : ''}">${i + 1}</span>
          <div class="card-ticker-group"><div class="card-ticker">${s.ticker}</div><div class="card-name">${s.name}</div></div>
        </div>
        <div class="card-yield ${getYieldClass(s.dividendYield)}">${s.dividendYield.toFixed(2)}%</div>
      </div>
      <div class="card-grid">
        <div class="card-metric"><div class="card-metric-label">연간배당</div><div class="card-metric-value">$${s.dividendRate.toFixed(2)}</div></div>
        <div class="card-metric"><div class="card-metric-label">주가</div><div class="card-metric-value">$${s.price.toFixed(2)}</div></div>
        <div class="card-metric"><div class="card-metric-label">배당성향</div><div class="card-metric-value ${getPayoutClass(s.payoutRatio)}">${s.payoutRatio != null ? s.payoutRatio.toFixed(1) + '%' : '-'}</div></div>
      </div>
      <div class="card-bottom">
        <span class="card-sector" style="border-color:${sectorColor};color:${sectorColor}">${sectorKr}</span>
        <span class="card-mcap">${formatMarketCap(s.marketCap)}</span>
        <span class="card-metric-value ${returnClass}">${returnText}</span>
      </div>
    </div>`;
  }).join('');

  updateStats(stocks);
}

function getFilteredStocks() {
  return currentFilter === 'all' ? allStocks : allStocks.filter(s => s.sector === currentFilter);
}

function filterSector(sector) {
  currentFilter = sector;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  sortAndRender(getFilteredStocks());
}

function searchStock(query) {
  const q = query.toUpperCase().trim();
  if (!q) { sortAndRender(getFilteredStocks()); return; }
  renderTable(getFilteredStocks().filter(s => s.ticker.includes(q) || s.name.toUpperCase().includes(q)));
}

function sortTable(key) {
  if (currentSort.key === key) currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
  else { currentSort.key = key; currentSort.dir = 'desc'; }
  sortAndRender(getFilteredStocks());
}

function sortAndRender(stocks) {
  const { key, dir } = currentSort;
  const sorted = [...stocks].sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va == null) va = -Infinity;
    if (vb == null) vb = -Infinity;
    if (typeof va === 'string') return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return dir === 'asc' ? va - vb : vb - va;
  });
  renderTable(sorted);
}

async function loadData() {
  try {
    const response = await fetch('dividend_data.json');
    if (!response.ok) throw new Error('Failed to load data');
    const data = await response.json();
    allStocks = data.stocks;
    document.getElementById('updateTime').textContent = `마지막 업데이트: ${data.updated} · ${data.count}개 종목`;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('stockTable').style.display = 'table';
    renderTable(allStocks);
  } catch (e) {
    console.log('Loading sample data...', e);
    loadSampleData();
  }
}
